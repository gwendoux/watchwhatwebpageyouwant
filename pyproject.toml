[project]
name = "veille-web"
version = "2.0.0"
description = "Surveillance de pages web hébergée sur GitHub"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "SIM", "RUF"]
ignore = [
  "E741",    # « l » pour une ligne de diff
  "RUF001",  # caractères typographiques français voulus (’ « » −)
  "RUF002",
  "RUF003",
  "S311",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S104", "E402", "E731"]
