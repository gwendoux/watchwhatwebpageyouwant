# Mises à jour automatiques (pull requests hebdomadaires) des actions et des dépendances Python.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
