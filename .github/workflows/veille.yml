name: Veille

on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures (minute 17 : moins de file d'attente qu'à l'heure pile)
  workflow_dispatch:
    inputs:
      test_push:
        description: "Envoyer une notification de test"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "**.md"

# Aucun droit par défaut : chaque job déclare uniquement ce dont il a besoin.
permissions: {}

concurrency:
  group: veille
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  check:
    name: Contrôle des pages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write        # commit de data/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true   # nécessaire au « git push » ci-dessous

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dépendances (versions figées, vérifiées par hash)
        run: pip install --require-hashes --only-binary ":all:" -r requirements.txt

      - name: Tests
        if: github.event_name == 'push'
        run: python -m unittest discover -s tests

      - name: Contrôle des pages
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ vars.PUSH_SUBSCRIPTIONS }}
          PUSH_TEST: ${{ inputs.test_push }}
        run: python scripts/check.py

      - name: Commit de data/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -q -m "Contrôle du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          for i in 1 2 3 4; do
            git push -q && exit 0
            sleep $((i * 5))
            git pull -q --rebase -X theirs
          done
          exit 1

      - name: Préparation du site
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          mkdir -p _site/data
          cp -r web/. _site/
          cp urls.json _site/
          cp data/status.json _site/data/
          cp -r data/history _site/data/
          python scripts/webpush.py public > _site/vapid.json
          sed -i "s/__BUILD__/${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}/" _site/sw.js

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Publication GitHub Pages
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write          # publication sur GitHub Pages
      id-token: write       # jeton OIDC exigé par deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
